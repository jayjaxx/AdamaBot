[project]
name = "adama"
version = "0.1.0"
description = """A DoW And Megagame Adjutant (ADAMA)
A Discord Bot for automating play of the Den of Wolves Megagame. 

Originally produced for the DiploStrats Diplomacy Community."""
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "discord-py>=2.7.1,<3",
]

[project.scripts]
main = "adama.main:main"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pydeps>=3.0.6",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# discord.py itself still calls asyncio.iscoroutinefunction (fine until Python 3.16).
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:discord",
]

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    ".venv",
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.14
target-version = "py314"

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
select = ["E4", "E7", "E9", "F"]
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pylint.master]
init-hook = "import sys; sys.path.insert(0, 'src'); sys.path.insert(0, '.')"
max-line-length = 120
extension-pkg-allow-list = ["lxml"]

[tool.pydeps]
# Only include your internal package
only = "adama"

# Ignore third-party / external libs
exclude = [
    "networkx.*",
    "numpy.*",
    "pandas.*",
    "matplotlib.*",
    "PIL.*",
    "scipy.*",
    "shapely.*"
]

# Cleaner graph output
no_show = true
rankdir = "LR"
